spring.application.name=demo

# Default profile (local development with SQLite)
spring.datasource.url=jdbc:sqlite:/tmp/app.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

# Production profile will override these settings via environment variables:
# SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/transcendence_db
# SPRING_DATASOURCE_USERNAME=transcendence_user  
# SPRING_DATASOURCE_PASSWORD=transcendence_pass
# SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQLDialect
# SPRING_JPA_HIBERNATE_DDL_AUTO=validate

# JWT settings
jwt.secret=${JWT_SECRET:$(openssl rand -base64 64 | tr -d '\n')}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# OAUTH Google settings
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.client-name=Google
