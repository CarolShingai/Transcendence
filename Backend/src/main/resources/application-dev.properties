# Configuracoes de desenvolvimento
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Em dev, evita cache de schema OpenAPI para refletir alteracoes apos restart
springdoc.cache.disabled=true

# Reduz ruido de warning comum em dev
spring.jpa.open-in-view=false

# HTTPS (dev) - certificado autoassinado em ./certs
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEYSTORE_PATH:file:./certs/keystore-dev.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:changeit}
server.ssl.key-store-type=${SSL_KEYSTORE_TYPE:PKCS12}
server.ssl.key-alias=${SSL_KEY_ALIAS:transcendence-dev}

# CORS (dev)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Frontend base URL for OAuth2 redirects
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:3000}

#OAUTH Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
