services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: transcendence_db
      MYSQL_USER: transcendence_user
      MYSQL_PASSWORD: transcendence_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data_dev:/var/lib/mysql
    networks:
      - transcendence-dev-net
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: dockerfile.dev
    working_dir: /workspace
    command: sh -c "chmod +x /workspace/dev-run.sh && /workspace/dev-run.sh"
    ports:
      - "8082:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # HTTPS (dev): o profile dev usa ./certs/keystore-dev.p12 dentro de /workspace
      SSL_KEYSTORE_PASSWORD: ${SSL_KEYSTORE_PASSWORD:-changeit}
      SSL_KEYSTORE_TYPE: ${SSL_KEYSTORE_TYPE:-PKCS12}
      SSL_KEY_ALIAS: ${SSL_KEY_ALIAS_DEV:-transcendence-dev}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS_DEV:-http://localhost:3000,https://localhost:3000}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/transcendence_db
      SPRING_DATASOURCE_USERNAME: transcendence_user
      SPRING_DATASOURCE_PASSWORD: transcendence_pass
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
      JWT_SECRET: ${JWT_SECRET:-fKHnZqCLlA6j8JktYk2qvfh4UG2KTbcjsRuc2SosMh7YFRfd/vf+qXkOHakG9nexHkAT6fk0l2M0fRKsn4x/MA==}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    volumes:
      - ./Backend:/workspace
      - gradle_cache_dev:/root/.gradle
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - transcendence-dev-net
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: >
      sh -c "mkdir -p /app/certs && if [ ! -f /app/certs/key-dev.pem ] || [ ! -f /app/certs/cert-dev.pem ]; then openssl req -x509 -nodes -newkey rsa:2048 -keyout /app/certs/key-dev.pem -out /app/certs/cert-dev.pem -days 825 -subj '/CN=localhost/O=Transcendence/OU=Dev/L=Local/ST=Local/C=BR' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' -batch; fi && npm install && HTTPS=true SSL_CRT_FILE=/app/certs/cert-dev.pem SSL_KEY_FILE=/app/certs/key-dev.pem npm start"
    ports:
      - "3000:3000"
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./Frontend:/app
      - frontend_certs_dev:/app/certs
      - frontend_node_modules_dev:/app/node_modules
    depends_on:
      - backend
    networks:
      - transcendence-dev-net
    restart: unless-stopped

networks:
  transcendence-dev-net:
    driver: bridge

volumes:
  mysql_data_dev:
    driver: local
  gradle_cache_dev:
    driver: local
  frontend_certs_dev:
    driver: local
  frontend_node_modules_dev:
    driver: local
