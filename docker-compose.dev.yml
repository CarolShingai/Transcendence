services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: transcendence_db
      MYSQL_USER: transcendence_user
      MYSQL_PASSWORD: transcendence_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data_dev:/var/lib/mysql
    networks:
      - transcendence-dev-net
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: dockerfile.dev
    working_dir: /workspace
    command: sh -c "chmod +x /workspace/dev-run.sh && /workspace/dev-run.sh"
    ports:
      - "8082:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # HTTPS (dev): o profile dev usa ./certs/keystore-dev.p12 dentro de /workspace
      SSL_KEYSTORE_PASSWORD: ${SSL_KEYSTORE_PASSWORD:-changeit}
      SSL_KEYSTORE_TYPE: ${SSL_KEYSTORE_TYPE:-PKCS12}
      SSL_KEY_ALIAS: ${SSL_KEY_ALIAS_DEV:-transcendence-dev}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS_DEV:-http://localhost:3000}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/transcendence_db
      SPRING_DATASOURCE_USERNAME: transcendence_user
      SPRING_DATASOURCE_PASSWORD: transcendence_pass
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
      JWT_SECRET: ${JWT_SECRET:-fKHnZqCLlA6j8JktYk2qvfh4UG2KTbcjsRuc2SosMh7YFRfd/vf+qXkOHakG9nexHkAT6fk0l2M0fRKsn4x/MA==}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    volumes:
      - ./Backend:/workspace
      - gradle_cache_dev:/root/.gradle
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - transcendence-dev-net
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: sh -c "npm install && npm start"
    ports:
      - "3000:3000"
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./Frontend:/app
      - frontend_node_modules_dev:/app/node_modules
    depends_on:
      - backend
    networks:
      - transcendence-dev-net
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: transcendence-node-exporter-dev
    ports:
      - "9101:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - transcendence-dev-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: transcendence-prometheus-dev
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml:ro
      - prometheus_data_dev:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    depends_on:
      - backend
      - node-exporter
    networks:
      - transcendence-dev-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: transcendence-grafana-dev
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: "grafana-piechart-panel"
    volumes:
      - grafana_data_dev:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - transcendence-dev-net
    restart: unless-stopped

networks:
  transcendence-dev-net:
    driver: bridge

volumes:
  mysql_data_dev:
    driver: local
  gradle_cache_dev:
    driver: local
  frontend_node_modules_dev:
    driver: local
  prometheus_data_dev:
    driver: local
  grafana_data_dev:
    driver: local
