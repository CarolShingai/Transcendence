services:
  mysql:
    image: mysql:8.0
    container_name: transcendence-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: transcendence_db
      MYSQL_USER: transcendence_user
      MYSQL_PASSWORD: transcendence_pass
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - transcendence-net
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    volumes:
      - ./Backend/certs:/app/certs:ro
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SSL_KEYSTORE_PATH=${SSL_KEYSTORE_PATH:-file:/app/certs/keystore-prod.p12}
      - SSL_KEYSTORE_PASSWORD=${SSL_KEYSTORE_PASSWORD:-changeit}
      - SSL_KEYSTORE_TYPE=${SSL_KEYSTORE_TYPE:-PKCS12}
      - SSL_KEY_ALIAS=${SSL_KEY_ALIAS_PROD:-transcendence-prod}
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS_PROD:-http://localhost:8080}
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/transcendence_db
      - SPRING_DATASOURCE_USERNAME=transcendence_user
      - SPRING_DATASOURCE_PASSWORD=transcendence_pass
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQLDialect
      - JWT_SECRET=${JWT_SECRET:-fKHnZqCLlA6j8JktYk2qvfh4UG2KTbcjsRuc2SosMh7YFRfd/vf+qXkOHakG9nexHkAT6fk0l2M0fRKsn4x/MA==}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-86400000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - transcendence-net
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - transcendence-net
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: transcendence-node-exporter
    ports:
      - "9101:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - transcendence-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: transcendence-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_started
      node-exporter:
        condition: service_started
    networks:
      - transcendence-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: transcendence-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: "grafana-piechart-panel"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    depends_on:
      - prometheus
    networks:
      - transcendence-net
    restart: unless-stopped

networks:
  transcendence-net:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
